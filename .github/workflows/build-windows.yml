name: Build Windows exe

on:
  push:
    branches: [main, tauri]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build
        run: npx tauri build

      - name: Collect exe
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/pulse.exe "release/Pulse-$v-portable.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ "release/Pulse-$v-setup.exe" }
          Get-ChildItem release | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-windows-${{ github.run_number }}
          path: release/*.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pulse build ${{ github.run_number }}
          body: "自动构建 · commit ${{ github.sha }}\n\n- `*-portable.exe`：免安装，双击即用（需要系统自带的 WebView2，Win10/11 一般已有）\n- `*-setup.exe`：安装版"
          files: release/*.exe
